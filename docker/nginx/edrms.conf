# EDRMS Production Architecture & Nginx Reverse Proxy Configuration
# Provides TLS 1.3 termination, HSTS, secure proxy headers, rate-limiting, and isolation.

# Upstream Backend API Service
upstream edrms_backend_upstream {
    server backend:8000;
    keepalive 32;
}

# Upstream Frontend Next.js Service
upstream edrms_frontend_upstream {
    server frontend:3000;
    keepalive 32;
}

# HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name edrms.example.gov;

    # Redirect all plain HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Primary HTTPS Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name edrms.example.gov;

    # SSL Certificate Paths (Configure with Let's Encrypt or Corporate PKI)
    ssl_certificate /etc/ssl/certs/edrms.crt;
    ssl_certificate_key /etc/ssl/private/edrms.key;

    # TLS Protocols & Cipher Suites (Modern Profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers (Defense-in-Depth)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max upload body size matching backend constraints (25MB)
    client_max_body_size 26M;

    # Route Backend API Requests
    location /api/ {
        proxy_pass http://edrms_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Route Frontend Next.js Application Requests
    location / {
        proxy_pass http://edrms_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
